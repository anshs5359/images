<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Wallpapers</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #fff;
  }

  header {
    padding: 20px;
    text-align: center;
  }

  .search-box {
    max-width: 600px;
    margin: 0 auto;
  }

  .search-box input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 30px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
  }

  h1 {
    text-align: center;
    font-size: 32px;
    margin: 30px 0;
  }

  .gallery {
    column-count: 3;
    column-gap: 14px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  @media (max-width: 900px) {
    .gallery {
      column-count: 2;
    }
  }

  @media (max-width: 600px) {
    .gallery {
      column-count: 1;
    }
  }

  .card {
    position: relative;
    break-inside: avoid;
    margin-bottom: 14px;
    border-radius: 10px;
    overflow: hidden;
  }

  .card img {
    width: 100%;
    display: block;
  }

  .overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .card:hover .overlay {
    opacity: 1;
  }

  .overlay span {
    font-size: 14px;
  }

  .download-btn {
    background: white;
    color: black;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 18px;
    cursor: pointer;
  }

  .download-btn:hover {
    background: #eee;
  }
</style>
</head>

<body>

<header>
  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="Search photos and wallpapers"
    >
  </div>
</header>

<h1>Download Free Wallpapers</h1>

<div class="gallery" id="gallery"></div>

<script>

  // ==========================================
  // APNI IMAGES YAHAN ADD KAREIN
  // ==========================================

  const wallpapers = [
    {
      image: "/ansh.png",
      name: "Nature Wallpaper"
    },

    {
      image: "/b.png",
      name: "Mountain Wallpaper"
    },

    {
      image: "images/wallpaper3.jpg",
      name: "Car Wallpaper"
    },

    {
      image: "images/wallpaper4.jpg",
      name: "Anime Wallpaper"
    },

    {
      image: "images/wallpaper5.jpg",
      name: "Gaming Wallpaper"
    },

    {
      image: "images/wallpaper6.jpg",
      name: "4K Wallpaper"
    }
  ];


  // ==========================================
  // GALLERY
  // ==========================================

  const gallery = document.getElementById("gallery");

  function showWallpapers(list) {

    gallery.innerHTML = "";

    list.forEach((wallpaper) => {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <img
          src="${wallpaper.image}"
          alt="${wallpaper.name}"
          loading="lazy"
        >

        <div class="overlay">

          <span>${wallpaper.name}</span>

          <button
            class="download-btn"
            onclick="downloadImage('${wallpaper.image}', '${wallpaper.name}')"
            title="Download"
          >
            ↓
          </button>

        </div>
      `;

      gallery.appendChild(card);

    });

  }


  // ==========================================
  // DOWNLOAD FUNCTION
  // ==========================================

  function downloadImage(image, name) {

    const link = document.createElement("a");

    link.href = image;
    link.download = name + ".jpg";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

  }


  // ==========================================
  // SEARCH
  // ==========================================

  document.getElementById("search").addEventListener("input", function () {

    const searchText = this.value.toLowerCase();

    const filtered = wallpapers.filter((wallpaper) =>
      wallpaper.name.toLowerCase().includes(searchText)
    );

    showWallpapers(filtered);

  });


  // Website load hote hi images show karo
  showWallpapers(wallpapers);

</script>

</body>
</html>
